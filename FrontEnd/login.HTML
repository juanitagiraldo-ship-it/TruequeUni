<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - TruequeUni</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #004d40; margin: 0; padding: 50px; }
        .contenedor-form { background-color: white; padding: 30px; max-width: 400px; margin: 0 auto; border: 1px solid #000000; }
        h2 { text-align: center; color: #000000; }
        label { display: block; margin-top: 15px; color: #000000; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #004d40; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #004d40; color: white; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .registro-link { text-align: center; margin-top: 15px; font-size: 14px; }
        a { color: #004d40; }
    </style>
</head>
<body>
    <div class="contenedor-form">
        <h2>Iniciar Sesión</h2>
        <!-- FORMULARIO MODIFICADO: Ahora pide Nombre/Alias -->
        <form action="catalogo.html">
            <label>Nombre o Alias registrado:</label>
            <input type="text" placeholder="Ej: Sofía López o SofLop22">
            
            <label>Contraseña:</label>
            <input type="password" placeholder="********">
            
            <button type="submit">Entrar</button>
        </form>
        <div class="registro-link">
            ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </div>
    </div>
</body>
</html>
