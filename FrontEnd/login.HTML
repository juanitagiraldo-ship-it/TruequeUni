<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - TruequeUni</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">TruequeUni</a>
        <nav>
            <a href="registro.html" class="btn-publicar">Registrarse</a>
        </nav>
    </header>

    <div class="container">
        <div class="form-container">
            <h2>Bienvenido a TruequeUni</h2>
            <form action="catalogo.html">
                <div class="form-group">
                    <label>Correo electrónico:</label>
                    <input type="email" placeholder="ejemplo@uam.edu.co" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </div>
    </div>
</body>
</html>
