<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido a TruequeUni</title>
    <style>
        /* Estilos basados en el banner oficial */
        body {
            background-color: #004d40; /* Verde oscuro del banner */
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-bienvenida {
            display: flex;
            width: 80%;
            max-width: 900px;
            align-items: center;
            justify-content: space-between;
        }

        .texto-izquierda {
            width: 50%;
            color: white;
        }

        .texto-izquierda h1 {
            font-size: 48px;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .texto-izquierda p {
            font-size: 20px;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .boton-ingresar {
            background-color: white;
            color: #004d40;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            border-radius: 5px;
            display: inline-block;
        }

        .boton-ingresar:hover {
            background-color: #e0e0e0;
        }

        .imagen-derecha {
            width: 40%;
            text-align: center;
        }

        .imagen-derecha img {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">TruequeUni</a>
        <nav>
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html" class="btn-publicar">Registrarse</a>
        </nav>
    </header>

    <div class="container" style="text-align: center; margin-top: 100px;">
        <h1 style="font-size: 48px; color: #1a1a1a;">Compartir nos conecta</h1>
        <p style="font-size: 20px; color: #666; margin-top: 20px;">Encuentra materiales de estudio o ropa en tu campus.</p>
        <a href="login.html" class="btn-primary" style="display: inline-block; width: 250px; margin-top: 40px; text-decoration: none;">Comenzar ahora</a>
    </div>
</body>
</html>
