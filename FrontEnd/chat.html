<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat - TruequeUni</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        header { background-color: #004d40; color: white; padding: 15px; margin-bottom: 20px; }
        header a { color: white; text-decoration: none; }
        .chat-box { display: flex; background-color: white; border: 1px solid #ccc; height: 400px; }
        .contactos { width: 30%; border-right: 1px solid #ccc; background-color: #f9f9f9; padding: 10px; }
        .contacto { padding: 10px; border-bottom: 1px solid #ccc; cursor: pointer; }
        .conversacion { width: 70%; padding: 20px; display: flex; flex-direction: column; }
        .mensajes { flex-grow: 1; }
        .burbuja-otro { background-color: #eee; padding: 10px; border-radius: 5px; width: fit-content; margin-bottom: 10px; }
        .burbuja-yo { background-color: #004d40; color: white; padding: 10px; border-radius: 5px; width: fit-content; margin-bottom: 10px; margin-left: auto; }
        .input-area { display: flex; margin-top: 10px; }
        .input-area input { flex-grow: 1; padding: 10px; border: 1px solid #004d40; }
        .input-area button { padding: 10px 20px; background-color: #004d40; color: white; border: none; }
    </style>
</head>
<body>
    <header>
        <a href="catalogo.html">&larr; Volver al catálogo</a>
    </header>

    <div class="chat-box">
        <div class="contactos">
            <h3>Mensajes</h3>
            <div class="contacto"><strong>Juan Pérez</strong><br><small>¿Sigue disponible?</small></div>
        </div>
        <div class="conversacion">
            <h3>Juan Pérez</h3>
            <div class="mensajes">
                <div class="burbuja-otro">Hola, ¿el libro sigue disponible?</div>
                <div class="burbuja-yo">Sí, claro. ¿Nos vemos en la biblioteca?</div>
            </div>
            <div class="input-area">
                <input type="text" placeholder="Escribe un mensaje...">
                <button>Enviar</button>
            </div>
        </div>
    </div>
</body>
</html>
