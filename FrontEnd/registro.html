<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - TruequeUni</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 50px; }
        .contenedor-form { background-color: white; padding: 30px; max-width: 400px; margin: 0 auto; border: 1px solid #035c193c; }
        h2 { text-align: center; color: #004d40; }
        label { display: block; margin-top: 15px; color: #555; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #004d40; color: white; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="contenedor-form">
        <h2>Crear Cuenta</h2>
        <form action="login.html">
            <label>Nombre o Alias:</label>
            <input type="text" placeholder="Ej: JuanP22">
            
            <label>Contraseña:</label>
            <input type="password" placeholder="********">
            
            <button type="submit">Registrarse</button>
        </form>
    </div>
</body>
</html>
