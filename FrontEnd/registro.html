
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - TruequeUni</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 50px; }
        .contenedor-form { background-color: white; padding: 30px; max-width: 400px; margin: 0 auto; border: 1px solid #035c193c; }
        h2 { text-align: center; color: #004d40; }
        label { display: block; margin-top: 15px; color: #555; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #004d40; color: white; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; }
        #mensaje { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="contenedor-form">
        <h2>Crear Cuenta</h2>

        <form id="formRegistro">
            <label>Nombre o Alias:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: JuanP22" required>

            <label>Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="********" required>

            <button type="submit">Registrarse</button>
        </form>

        <p id="mensaje"></p>
    </div>

    <script>
        document.getElementById("formRegistro").addEventListener("submit", async function(event) {
            event.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const contrasena = document.getElementById("contrasena").value;
            const mensaje = document.getElementById("mensaje");

            try {
                const respuesta = await fetch("/api/registro", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        nombre: nombre,
                        contrasena: contrasena
                    })
                });

                const resultado = await respuesta.text();

                if (respuesta.ok) {
                    mensaje.style.color = "green";
                    mensaje.textContent = resultado;

                    setTimeout(() => {
                        window.location.href = "/login.HTML";
                    }, 1500);

                } else {
                    mensaje.style.color = "red";
                    mensaje.textContent = resultado;
                }

            } catch (error) {
                mensaje.style.color = "red";
                mensaje.textContent = "No fue posible conectar con el servidor";
            }
        });
    </script>
</body>
</html>
