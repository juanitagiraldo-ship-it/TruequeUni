<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - TruequeUni</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        header { background-color: #004d40; color: white; padding: 15px; display: flex; justify-content: space-between; }
        header a { color: white; text-decoration: none; margin-left: 15px; }
        .barra-busqueda { margin: 20px 0; }
        .barra-busqueda input { padding: 10px; width: 300px; border: 1px solid #ccc; }
        .barra-busqueda button { padding: 10px 20px; background-color: #004d40; color: white; border: none; }
        
        .grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .tarjeta { background-color: #056353; border: 1px solid rgb(0, 0, 0); width: 250px; padding: 15px; }
        .tarjeta img { width: 100%; height: 150px; background-color: #dddddd; object-fit: cover; }
        .etiqueta { background-color: #004d40; padding: 5px; font-size: 15px; display: inline-block; margin-top: 10px; }
        .titulo-articulo { font-size: 18px; font-weight: bold; margin: 10px 0 5px 0; }
        .info-usuario { font-size: 14px; color: rgb(0, 0, 0); }
    </style>
</head>
<body>
    <header>
        <div><strong>TruequeUni</strong></div>
        <nav>
            <a href="catalogo.html">Catálogo</a>
            <a href="mis_publicaciones.html">Mis Publicaciones</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="publicar.html">+ Publicar</a>
        </nav>
    </header>

    <main>
        <h2>Encuentra un artículo</h2>
        <form class="barra-busqueda" id="formularioBusqueda">
            <input type="search" id="campoBusqueda"
                   placeholder="Buscar por título, descripción o categoría..."
                   aria-label="Buscar publicaciones">
            <button type="submit">Buscar</button>
        </form>
            <div class="grid" id="contenedorPublicaciones">
                <p>Cargando publicaciones...</p>
            </div>
        
    </main>
    <script>
        const formularioBusqueda = document.getElementById("formularioBusqueda");
        const campoBusqueda = document.getElementById("campoBusqueda");
        const contenedor = document.getElementById("contenedorPublicaciones");

        async function cargarPublicaciones(busqueda = "") {
            contenedor.textContent = "Cargando publicaciones...";

            try {
                const parametros = new URLSearchParams();
                if (busqueda.trim()) {
                    parametros.set("busqueda", busqueda.trim());
                }
                const consulta = parametros.toString();
                const url = consulta
                    ? "/api/catalogo?" + consulta
                    : "/api/catalogo";
                const respuesta = await fetch(url);

                if (!respuesta.ok) {
                    throw new Error("No se pudieron cargar las publicaciones.");
                }

                const publicaciones = await respuesta.json();
                contenedor.replaceChildren();

                if (publicaciones.length === 0) {
                    contenedor.textContent = busqueda.trim()
                        ? "No se encontraron publicaciones para esa búsqueda."
                        : "No hay publicaciones disponibles.";
                    return;
                }

                publicaciones.forEach(publicacion => {
                    const tarjeta = document.createElement("div");
                    tarjeta.className = "tarjeta";

                    const imagen = document.createElement("img");
                    imagen.src = publicacion.imagen || "logo.png";
                    imagen.alt = publicacion.titulo;

                    const estado = document.createElement("span");
                    estado.className = "etiqueta";
                    estado.textContent = publicacion.estadoFisico;

                    const titulo = document.createElement("div");
                    titulo.className = "titulo-articulo";
                    titulo.textContent = publicacion.titulo;

                    const descripcion = document.createElement("div");
                    descripcion.className = "info-usuario";
                    descripcion.textContent = publicacion.descripcion || "";

                    const usuario = document.createElement("div");
                    usuario.className = "info-usuario";
                    usuario.textContent = publicacion.nombreUsuario +
                        " (" + (publicacion.programa || "Sin programa") + ")";

                    const categoria = document.createElement("div");
                    categoria.className = "info-usuario";
                    categoria.textContent = "Categoria: " + publicacion.categoria;

                    const oferta = document.createElement("div");
                    oferta.className = "info-usuario";
                    oferta.textContent = "Oferta: " + publicacion.tipoOferta;

                    const contacto = document.createElement("a");
                    contacto.href = "chat.html";
                    contacto.textContent = "Contactar";
                    contacto.style.cssText =
                        "display:block;text-align:center;background-color:#000;color:white;padding:8px;text-decoration:none;margin-top:10px;";

                    tarjeta.append(
                        imagen,
                        estado,
                        titulo,
                        descripcion,
                        usuario,
                        categoria,
                        oferta,
                        contacto
                    );

                    contenedor.appendChild(tarjeta);
                });
            } catch (error) {
                contenedor.textContent = "Error al cargar las publicaciones.";
                console.error(error);
            }
        }

        formularioBusqueda.addEventListener("submit", event => {
            event.preventDefault();
            cargarPublicaciones(campoBusqueda.value);
        });

        cargarPublicaciones();
    </script>
</body>
</html>
