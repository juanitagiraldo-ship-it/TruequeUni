<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Publicar Artículo - TruequeUni</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        header { background-color: #004d40; color: white; padding: 15px; margin-bottom: 30px; }
        header a { color: white; text-decoration: none; margin-right: 15px; }
        .formulario { background-color: white; border: 1px solid #035c193c; padding: 30px; max-width: 500px; margin: 0 auto; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #004d40; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #035c193c; box-sizing: border-box; }
        button { background-color: #004d40; color: white; padding: 12px; border: none; width: 100%; margin-top: 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <a href="catalogo.html"> &larr; Volver al catálogo</a>
    </header>

    <div class="formulario">
        <h2>Publicar un Artículo</h2>
        <form id="formPublicar">
            <label>Título del artículo:</label>
            <input type="text" id="titulo" maxlength="100"
                   placeholder="Ej: Libro de Física" required>

            <label>Categoría:</label>
            <select id="idCategoria" required>
                <option value="" selected disabled>Seleccione...</option>
                <option value="1">Libros</option>
                <option value="2">Ropa</option>
                <option value="3">Tecnología</option>
                <option value="4">Artículos para el hogar</option>
            </select>

            <label>Estado físico:</label>
            <select id="estadoFisico" required>
                <option value="" selected disabled>Seleccione...</option>
                <option value="Nuevo">Nuevo</option>
                <option value="Buen estado">Buen estado</option>
                <option value="Usado">Usado</option>
            </select>

            <label>Tipo de oferta:</label>
            <select id="tipoOferta" required>
                <option value="" selected disabled>Seleccione...</option>
                <option value="donacion">Donación</option>
                <option value="intercambio">Intercambio</option>
            </select>

            <label>Descripción y contacto:</label>
            <textarea id="descripcion" rows="4"
                      placeholder="Describe el artículo e incluye un número de contacto si deseas..."></textarea>

            <label>Fotografía:</label>
            <input type="file" id="imagen" accept="image/png,image/jpeg,image/gif">

            <button type="submit">Publicar</button>
        </form>
        <p id="mensaje" role="status"></p>
    </div>
    <script>
        const formulario = document.getElementById("formPublicar");
        const mensaje = document.getElementById("mensaje");
        const maximoImagenBytes = 5 * 1024 * 1024;

        function leerArchivoComoDataURL(archivo) {
            return new Promise((resolve, reject) => {
                const lector = new FileReader();
                lector.onload = () => resolve(lector.result);
                lector.onerror = () => reject(new Error("No se pudo leer la imagen."));
                lector.readAsDataURL(archivo);
            });
        }

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();
            mensaje.textContent = "";

            const archivo = document.getElementById("imagen").files[0];
            let imagenBase64 = "";
            let tipoImagen = "";

            try {
                if (archivo) {
                    if (archivo.size > maximoImagenBytes) {
                        throw new Error("La imagen no puede superar los 5 MB.");
                    }

                    if (!["image/png", "image/jpeg", "image/gif"].includes(archivo.type)) {
                        throw new Error("Selecciona una imagen PNG, JPEG o GIF.");
                    }

                    const dataURL = await leerArchivoComoDataURL(archivo);
                    imagenBase64 = dataURL.substring(dataURL.indexOf(",") + 1);
                    tipoImagen = archivo.type;
                }

                const datos = new URLSearchParams({
                    titulo: document.getElementById("titulo").value.trim(),
                    idCategoria: document.getElementById("idCategoria").value,
                    estadoFisico: document.getElementById("estadoFisico").value,
                    tipoOferta: document.getElementById("tipoOferta").value,
                    descripcion: document.getElementById("descripcion").value,
                    imagenBase64: imagenBase64,
                    tipoImagen: tipoImagen
                });

                const respuesta = await fetch("/api/publicaciones", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: datos
                });

                const resultado = await respuesta.text();
                mensaje.style.color = respuesta.ok ? "green" : "red";
                mensaje.textContent = resultado;

                if (respuesta.ok) {
                    setTimeout(() => {
                        window.location.href = "/catalogo.html";
                    }, 1000);
                }
            } catch (error) {
                mensaje.style.color = "red";
                mensaje.textContent = error.message;
            }
        });
    </script>
</body>
</html>
